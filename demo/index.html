<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wanim · manim Python in the browser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" />
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "wanim": "../dist/wanim.browser.js",
    "numpy-ts": "../dist/numpy-ts.browser.js",
    "py2js": "../dist/py2js.browser.js"
  }
}
</script>
</head>
<body>
<main>
  <section class="editor-col">
    <div class="bar">
      <label class="bar-label" for="preset">示例 / Example</label>
      <select id="preset" title="example scene">
        <option value="square">SquareToCircle</option>
        <option value="opening">OpeningManim</option>
        <option value="unitcircle">Sine from Unit Circle</option>
        <option value="pointcloud">Point Cloud</option>
        <option value="formula">Moving Frame Box</option>
        <option value="threeD">3D Surface Plot</option>
        <option value="threeDCamera">3D Camera Rotation</option>
        <option value="interactive">Interactive Controls</option>
        <option value="interactive3d">Interactive 3D Orbit</option>
      </select>
      <a class="bar-label" style="margin-left:auto" href="./component.html" title="zero-config web component demo">&lt;wanim-scene&gt; demo →</a>
    </div>
    <div class="editor">
      <pre id="highlight" aria-hidden="true"><code id="highlight-code" class="language-python"></code></pre>
      <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>
    <div class="bar bar-bottom">
      <button id="run" class="primary">运行 / Run</button>
      <button id="embed" title="generate an iframe snippet pointing at a minimal player page">嵌入 / Embed</button>
      <span id="status">Idle.</span>
    </div>
  </section>

  <section class="stage-col">
    <div class="canvas-wrap">
      <canvas id="stage" width="1280" height="720"></canvas>
    </div>
    <pre id="output"></pre>
  </section>
</main>

<!-- "嵌入 / Embed" dialog: builds an iframe snippet pointing at ./embed.html
     with the compressed code in the URL fragment. -->
<div id="embed-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="嵌入 / Embed">
    <h2>嵌入 / Embed</h2>
    <p class="modal-note">
      生成一段指向 <code>embed.html</code> 的 <code>&lt;iframe&gt;</code> 代码；
      Python 代码压缩后放在 URL fragment（<code>#c=…</code>）里，不会发送给服务器。
    </p>
    <div class="embed-grid">
      <label>宽 / Width
        <input id="embed-width" type="number" min="160" step="10" value="960" />
      </label>
      <label>高 / Height
        <input id="embed-height" type="number" min="90" step="10" value="540" />
      </label>
      <label>画质 / Quality
        <select id="embed-quality">
          <option value="-ql">-ql 480p</option>
          <option value="-qm" selected>-qm 720p</option>
          <option value="-qh">-qh 1080p</option>
          <option value="-q4k">-q4k 4K</option>
        </select>
      </label>
    </div>
    <textarea id="embed-snippet" readonly spellcheck="false" placeholder="生成中…"></textarea>
    <div id="embed-warning" class="embed-warning" hidden></div>
    <div class="modal-actions">
      <span id="embed-status" class="modal-note"></span>
      <span class="grow"></span>
      <button id="embed-copy">复制 / Copy</button>
      <button id="embed-close" class="primary">关闭 / Close</button>
    </div>
  </div>
</div>

<!-- Prism (syntax highlighting) is loaded from its official CDN; the editor
     still works as a plain textarea if the CDN is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js" defer></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
