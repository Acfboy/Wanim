<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wanim · Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "wanim": "../dist/wanim.browser.js",
    "numpy-ts": "../dist/numpy-ts.browser.js",
    "py2js": "../dist/bridge.browser.js"
  }
}
</script>
</head>
<body>
<main class="root">
  <div class="split">
    <section class="editor-pane">
      <div class="editor">
        <div id="gutter" class="gutter" aria-hidden="true"></div>
        <pre id="highlight" aria-hidden="true"><code id="highlight-code" class="language-python"></code></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Python source"></textarea>
      </div>
    </section>

    <section class="right-pane">
      <div class="preview">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>
      <div id="output" class="output" role="log" aria-live="polite"></div>
    </section>
  </div>

  <div class="bar">
    <span class="app-title">wanim Playground</span>
    <label class="select-wrap">
      <span class="select-label">Example</span>
      <select id="preset" title="Example scene">
        <option value="square">SquareToCircle</option>
        <option value="opening">OpeningManim</option>
        <option value="unitcircle">Sine from Unit Circle</option>
        <option value="pointcloud">Point Cloud</option>
        <option value="formula">Moving Frame Box</option>
        <option value="threeD">3D Surface Plot</option>
        <option value="threeDCamera">3D Camera Rotation</option>
        <option value="interactive">Interactive Controls</option>
        <option value="interactive3d">Interactive 3D Orbit</option>
      </select>
    </label>
    <a class="bar-link" href="./component.html" title="Zero-config web component demo">&lt;wanim-scene&gt; demo →</a>
    <span class="hint">Ctrl+Enter to run</span>
    <div class="actions">
      <button id="embed" class="ghost-button" type="button" title="Generate an iframe snippet pointing at a minimal player page">Embed</button>
      <button id="run" class="run-button" type="button" title="Run the scene (Ctrl+Enter)">Run</button>
    </div>
  </div>
</main>

<!-- "Embed" dialog: builds an iframe snippet pointing at ./embed.html with the
     compressed code in the URL fragment. -->
<div id="embed-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Embed">
    <h2>Embed</h2>
    <p class="modal-note">
      Builds an <code>&lt;iframe&gt;</code> snippet pointing at <code>embed.html</code>;
      the Python code is compressed into the URL fragment (<code>#c=…</code>) and
      never sent to a server.
    </p>
    <div class="embed-grid">
      <label>Width
        <input id="embed-width" type="number" min="160" step="10" value="960" />
      </label>
      <label>Height
        <input id="embed-height" type="number" min="90" step="10" value="540" />
      </label>
      <label>Quality
        <select id="embed-quality">
          <option value="-ql">-ql 480p</option>
          <option value="-qm" selected>-qm 720p</option>
          <option value="-qh">-qh 1080p</option>
          <option value="-q4k">-q4k 4K</option>
        </select>
      </label>
    </div>
    <textarea id="embed-snippet" readonly spellcheck="false" placeholder="Generating…"></textarea>
    <div id="embed-warning" class="embed-warning" hidden></div>
    <div class="modal-actions">
      <span id="embed-status" class="modal-note"></span>
      <span class="grow"></span>
      <button id="embed-copy" class="ghost-button" type="button">Copy</button>
      <button id="embed-close" class="run-button" type="button">Close</button>
    </div>
  </div>
</div>

<!-- Prism (syntax highlighting) is loaded from its official CDN; the editor
     still works as a plain textarea if the CDN is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js" defer></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
