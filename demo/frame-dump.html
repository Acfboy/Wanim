<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>wanim frame dump (test harness)</title>
<script type="importmap">
{
  "imports": {
    "wanim": "./wanim.browser.js",
    "numpy-ts": "../node_modules/numpy-ts/dist/numpy-ts.browser.js"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import { configureWasm } from "numpy-ts";
try { configureWasm({ maxMemory: 1024 * 1024 * 1024 }); } catch {}
const wanim = await import("wanim");
const canvas = document.getElementById("stage");

// Render one frame of an mjson document (URL given as ?mjson=...&frame=N) and
// stash the PNG data URL on window for the test runner to read.
window.renderFrame = async (url, index) => {
  const text = await (await fetch(url)).text();
  const doc = wanim.parse_mjson(text);
  const player = new wanim.MJSONCanvasPlayer(canvas, doc);
  player.renderFrame(index);
  return {
    dataUrl: canvas.toDataURL("image/png"),
    totalFrames: player.totalFrames,
    is3D: player.is3D,
  };
};
window.__ready = true;
</script>
</body>
</html>
